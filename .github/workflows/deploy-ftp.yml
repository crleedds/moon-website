name: Deploy theme to Cafe24 via FTP

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/moondental-child/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (파일 변경 없이 미리보기)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # v3.44.199 · 업로드 전에 구문 검사. 여기서 걸리면 서버에는 올라가지 않는다.
      - name: PHP syntax check
        run: |
          php -v > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
          echo "PHP $(php -r 'echo PHP_VERSION;')"
          ERR=0
          COUNT=0
          while IFS= read -r F; do
            COUNT=$((COUNT + 1))
            if ! php -l "$F" > /tmp/lint.out 2>&1; then
              echo "❌ $F"
              cat /tmp/lint.out
              ERR=1
            fi
          done < <(find wp-content/themes/moondental-child -name '*.php')
          if [ "$ERR" -ne 0 ]; then
            echo ""
            echo "❌ PHP 구문 오류 — 배포를 중단합니다 (서버 파일은 그대로입니다)."
            exit 1
          fi
          echo "✓ PHP 구문 검사 통과 ($COUNT개 파일)"

          # v3.44.207 · 함수 중복 정의 검사
          #   php -l 은 파일 단위 파싱만 하므로 서로 다른 파일에 같은 이름의
          #   함수를 정의해도 통과한다. 실제로는 로드 시점에
          #   'Cannot redeclare' 치명적 오류가 나 사이트 전체가 죽는다.
          #   (v3.44.206 에서 moondental_jsonld_faq 중복으로 실제 발생)
          echo ""
          echo "── 함수 중복 정의 검사"
          DUPES=$(grep -rhoE '^[[:space:]]*function[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' \
                    --include='*.php' wp-content/themes/moondental-child \
                  | awk '{print $2}' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ 같은 이름의 함수가 두 번 이상 정의되어 있습니다:"
            echo "$DUPES" | while IFS= read -r FN; do
              [ -z "$FN" ] && continue
              echo "  · $FN"
              grep -rnE "^[[:space:]]*function[[:space:]]+${FN}[[:space:]]*\(" \
                --include='*.php' wp-content/themes/moondental-child | sed 's/^/      /'
            done
            echo ""
            echo "   PHP 로드 시 Cannot redeclare 로 사이트 전체가 500 이 됩니다."
            echo "   배포를 중단합니다 (서버 파일은 그대로입니다)."
            exit 1
          fi
          echo "✓ 함수 중복 없음"

      - name: Check secrets are present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$FTP_HOST" ] && MISSING="$MISSING FTP_HOST"
          [ -z "$FTP_USER" ] && MISSING="$MISSING FTP_USERNAME"
          [ -z "$FTP_PASS" ] && MISSING="$MISSING FTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "❌ 비어 있는 secret:$MISSING"
            echo "   GitHub → Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          echo "✓ secret 3종 존재 (HOST ${#FTP_HOST}자 · USER ${#FTP_USER}자 · PASS ${#FTP_PASS}자)"

      - name: Connect, locate theme dir, and deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail

          PORT="${FTP_PORT:-}"
          [ -z "$PORT" ] && PORT=21

          # 비밀번호를 lftp 스크립트 문자열에 넣지 않는다 (쉼표·따옴표 등 특수문자 안전)
          export LFTP_PASSWORD="$FTP_PASS"

          SSL_OFF='set ftp:ssl-allow no;'
          SSL_ON='set ftp:ssl-allow yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no;'

          # $1 = SSL 설정 · $2 = 실행할 lftp 명령
          #
          # v3.44.197 · $2 안에서 경로를 따옴표로 감싸지 말 것.
          #   lftp 는 -e 문자열의 따옴표를 벗기지 않고 경로 일부로 서버에 보낸다.
          #   cd "wp-content" → 서버는 ~/"wp-content 를 찾아 550 으로 실패하고,
          #   절대경로 "/www/... 조차 앞의 " 때문에 홈 기준 상대경로가 된다.
          #   run #322~#328 이 전부 이 이유로 실패했다.
          run_lftp() {
            lftp -u "$FTP_USER" --env-password -p "$PORT" "ftp://$FTP_HOST" -e "
              $1
              set ftp:passive-mode true;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set cmd:fail-exit true;
              $2
              bye;
            "
          }

          # ── 1. 접속 모드 확정 (평문 FTP → 실패 시 FTPS) ──────────────
          echo "════════ 1. FTP 접속 ════════"
          SSL_MODE=""
          for MODE in OFF ON; do
            if [ "$MODE" = "OFF" ]; then S="$SSL_OFF"; else S="$SSL_ON"; fi
            echo "── 시도: FTPS=$MODE (포트 $PORT)"
            if run_lftp "$S" "pwd;" > /tmp/conn.log 2>&1; then
              echo "✓ 접속 성공 (FTPS=$MODE)"
              cat /tmp/conn.log
              SSL_MODE="$S"
              break
            fi
            echo "✗ 실패"
            cat /tmp/conn.log
          done

          if [ -z "$SSL_MODE" ]; then
            echo ""
            echo "❌ FTP 접속 자체가 실패했습니다."
            echo "   Cafe24 FTP 호스트·아이디·비밀번호·포트를 재확인하세요."
            echo "   (Cafe24 는 비밀번호 변경 시 FTP 비밀번호가 함께 바뀝니다)"
            exit 1
          fi

          # ── 2. FTP 홈 최상위 확인 ────────────────────────────────────
          # 경로를 추측하지 않는다. 서버가 알려주는 실제 목록에서 후보를 만든다.
          echo ""
          echo "════════ 2. FTP 홈 최상위 ════════"
          run_lftp "$SSL_MODE" "cls -1 --classify;" > /tmp/home.log 2>&1 || true
          cat /tmp/home.log

          # cls --classify 는 디렉터리 이름 끝에 / 를 붙인다 → 디렉터리만 후보로 수집
          ROOTS=(".")
          while IFS= read -r NAME; do
            case "$NAME" in
              */) NAME="${NAME%/}" ;;
              *)  continue ;;
            esac
            case "$NAME" in
              ""|"."|"..") continue ;;
              *\ *)        continue ;;
            esac
            ROOTS+=("$NAME")
          done < /tmp/home.log

          # 홈 목록을 못 읽었을 때 대비한 고정 후보 (중복은 TRIED 로 걸러진다)
          ROOTS+=(www public_html html htdocs web wordpress)

          SUFFIXES=(
            "wp-content/themes/moondental-child"
            "themes/moondental-child"
            "moondental-child"
          )

          # ── 3. 테마 폴더 탐색 ────────────────────────────────────────
          echo ""
          echo "════════ 3. 테마 폴더 탐색 ════════"
          WORKING_PATH=""
          TRIED=" "
          for ROOT in "${ROOTS[@]}"; do
            for SUF in "${SUFFIXES[@]}"; do
              if [ "$ROOT" = "." ]; then TARGET="$SUF"; else TARGET="$ROOT/$SUF"; fi
              case "$TRIED" in *" $TARGET "*) continue ;; esac
              TRIED="$TRIED$TARGET "

              echo "── 시도: cd $TARGET"
              # 따옴표 없이 전달 (run_lftp 주석 참고)
              if run_lftp "$SSL_MODE" "cd $TARGET; pwd; cls -1;" > /tmp/probe.log 2>&1; then
                # 안전장치: 실제 테마 폴더인지 확인한 뒤에만 --delete 미러링 허용
                if grep -qx 'style.css' /tmp/probe.log && grep -qx 'functions.php' /tmp/probe.log; then
                  WORKING_PATH="$TARGET"
                  echo "✓ 확정 — style.css · functions.php 확인됨"
                  break 2
                fi
                echo "? cd 는 성공했으나 테마 파일이 없음 → 건너뜀"
                head -20 /tmp/probe.log
              else
                echo "✗ 접근 불가"
                tail -3 /tmp/probe.log
              fi
            done
          done

          # ── 3-b. 최후 수단: 서버에서 직접 찾는다 ──────────────────────
          if [ -z "$WORKING_PATH" ]; then
            echo ""
            echo "════════ 3-b. find 로 직접 탐색 ════════"
            run_lftp "$SSL_MODE" "find -d 4 .;" > /tmp/find.log 2>&1 || true
            echo "── moondental 을 포함한 경로:"
            grep -i 'moondental' /tmp/find.log | head -30
            echo "── wp-content/themes 를 포함한 경로:"
            grep -i 'wp-content/themes' /tmp/find.log | head -30

            CAND="$(grep -iE 'moondental-child/?$' /tmp/find.log | head -1 | sed -e 's#^\./##' -e 's#/$##')"
            if [ -n "$CAND" ]; then
              echo "── find 가 찾은 후보: $CAND"
              if run_lftp "$SSL_MODE" "cd $CAND; cls -1;" > /tmp/probe.log 2>&1 \
                 && grep -qx 'style.css' /tmp/probe.log \
                 && grep -qx 'functions.php' /tmp/probe.log; then
                WORKING_PATH="$CAND"
                echo "✓ 확정 — style.css · functions.php 확인됨"
              fi
            fi
          fi

          if [ -z "$WORKING_PATH" ]; then
            echo ""
            echo "❌ moondental-child 테마 폴더를 찾지 못했습니다."
            echo "   FTP 로그인은 되지만 경로가 다릅니다."
            echo "   위 '2. FTP 홈 최상위' 와 '3-b. find' 출력에서 실제 경로를 확인하세요."
            exit 1
          fi

          # ── 4. 배포 ─────────────────────────────────────────────────
          DRY_FLAG=""
          if [ "${DRY_RUN:-}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo ""
            echo "★ Dry run 모드 — 실제 파일은 바뀌지 않습니다"
          fi

          echo ""
          echo "════════ 4. 배포: $WORKING_PATH ════════"
          if ! run_lftp "$SSL_MODE" "
            set mirror:parallel-transfer-count 3;
            cd $WORKING_PATH;
            mirror --reverse --delete --verbose --no-perms $DRY_FLAG \
              --exclude-glob '.git*' \
              --exclude-glob '.github/**' \
              --exclude-glob 'node_modules/**' \
              --exclude-glob '.DS_Store' \
              --exclude-glob 'README.md' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              wp-content/themes/moondental-child/ \
              .;
          "; then
            echo ""
            echo "❌ 업로드 중 오류가 발생했습니다 (위 로그 확인)."
            exit 1
          fi

          # ── 5. 검증 ─────────────────────────────────────────────────
          echo ""
          echo "════════ 5. 업로드 검증 ════════"
          run_lftp "$SSL_MODE" "cd $WORKING_PATH; cls -l style.css functions.php page-templates/page-location.php;" || true

          echo ""
          echo "★ Deploy complete. (경로: $WORKING_PATH)"
