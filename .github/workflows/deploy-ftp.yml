name: Deploy theme to Cafe24 via FTP

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/moondental-child/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (파일 변경 없이 미리보기)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Try multiple CD strategies and deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "★ Dry run mode"
          fi

          # 전략 후보 (Cafe24 FTP 다양한 초기 CWD 대응)
          STRATEGIES=(
            "wp-content/themes/moondental-child"
            "/www/wp-content/themes/moondental-child"
            "www/wp-content/themes/moondental-child"
            "/wp-content/themes/moondental-child"
            "moondental-child"
          )

          WORKING_PATH=""
          for TARGET in "${STRATEGIES[@]}"; do
            echo ""
            echo "════════════════════════════════════════════════"
            echo "★ 시도: cd $TARGET"
            echo "════════════════════════════════════════════════"

            RESULT=$(lftp -c "
              set ftp:ssl-allow no;
              set ftp:passive-mode true;
              set net:timeout 15;
              set cmd:fail-exit yes;
              open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
              cd $TARGET;
              pwd;
              bye;
            " 2>&1) || echo "실패"

            if echo "$RESULT" | grep -qE 'Access failed|550|No such file'; then
              echo "✗ 실패: 이 경로 사용 불가"
            else
              echo "✓ 성공! 이 경로로 접근 가능"
              WORKING_PATH="$TARGET"
              break
            fi
          done

          if [ -z "$WORKING_PATH" ]; then
            echo ""
            echo "❌ 모든 경로 실패. FTP 접속 자체 문제 가능성. 로그인·비밀번호 재확인 필요."
            exit 1
          fi

          echo ""
          echo "════════════════════════════════════════════════"
          echo "★ 확정 경로: $WORKING_PATH"
          echo "★ 배포 시작..."
          echo "════════════════════════════════════════════════"

          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            cd $WORKING_PATH;
            mirror --reverse --delete --verbose --no-perms $DRY_FLAG \
              --exclude-glob '.git*' \
              --exclude-glob '.github/**' \
              --exclude-glob 'node_modules/**' \
              --exclude-glob '.DS_Store' \
              --exclude-glob 'README.md' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              wp-content/themes/moondental-child/ \
              .;
            bye;
          "
          echo ""
          echo "★ Deploy complete."
