name: Deploy theme to Cafe24 via FTP

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/moondental-child/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (파일 변경 없이 미리보기)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Discover FTP directory structure
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          echo "=== 로그인 후 홈 위치 확인 ==="
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            pwd;
            ls -la;
            bye;
          "
          echo ""
          echo "=== www 폴더 있으면 그 안 확인 ==="
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            cd www 2>/dev/null && pwd && ls -la || echo 'www 폴더 없음';
            bye;
          " || true
          echo ""
          echo "=== wp-content 폴더 위치 검색 ==="
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            find . -name 'wp-content' -type d 2>/dev/null | head -5;
            bye;
          " || true

      - name: Deploy theme via lftp mirror
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "★ Dry run mode"
          fi

          echo "★ Deploying theme to Cafe24 (path: www/wp-content/themes/moondental-child/)..."
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            mirror --reverse --delete --verbose --no-perms $DRY_FLAG \
              --exclude-glob '.git*' \
              --exclude-glob '.github/**' \
              --exclude-glob 'node_modules/**' \
              --exclude-glob '.DS_Store' \
              --exclude-glob 'README.md' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              wp-content/themes/moondental-child/ \
              www/wp-content/themes/moondental-child/;
            bye;
          "
          echo "★ Deploy complete."
