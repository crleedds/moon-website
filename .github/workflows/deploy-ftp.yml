name: Deploy theme to Cafe24 via FTP

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/moondental-child/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (파일 변경 없이 미리보기)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List local theme folder
        run: |
          echo "=== Local theme folder contents ==="
          ls -la wp-content/themes/moondental-child/ | head -30
          echo "=== assets folder ==="
          ls -la wp-content/themes/moondental-child/assets/ || echo "assets folder not found locally"

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./wp-content/themes/moondental-child/
          server-dir: /www/wp-content/themes/moondental-child/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/README.md
            **/.github/**
            **/.ftp-deploy-sync-state.json
          log-level: verbose
          dangerous-clean-slate: false
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
